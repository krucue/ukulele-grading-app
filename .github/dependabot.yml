# ให้ Dependabot เปิด PR อัตโนมัติเมื่อมีเวอร์ชันใหม่
# เอกสาร: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # ---------- GitHub Actions ใน .github/workflows/ ----------
  # ตัวนี้จำเป็นจริง — actions/checkout กับ setup-python เพิ่งค้างอยู่ที่ v4/v5
  # จนขึ้นคำเตือน Node.js 20 deprecated โดยไม่มีใครรู้
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
    groups:
      # รวมทุก action ไว้ใน PR เดียว จะได้ไม่มี PR ย่อยเต็มไปหมด
      actions:
        patterns: ["*"]

  # ---------- ไลบรารี Python ใน requirements.txt ----------
  # หมายเหตุ: requirements.txt ใช้ข้อจำกัดแบบ ">=" ไม่ได้ปักเวอร์ชันตายตัว
  # เครื่องที่ pip install ก็ได้ตัวล่าสุดอยู่แล้ว การยกพื้นขั้นต่ำจึงแทบไม่ได้อะไร
  # มีแต่จะตัดเครื่องที่ Python เก่าออกไป (PR #1 ยก numpy>=2.5.2 ซึ่งต้องการ
  # Python>=3.12 ทำให้ job Python 3.10 ติดตั้ง dependency ไม่ผ่านทั้ง 2 OS)
  #
  # increase-if-necessary = ยกพื้นเฉพาะตอนจำเป็นจริง เช่นมีช่องโหว่ความปลอดภัย
  # หรือเวอร์ชันเดิมใช้ไม่ได้แล้ว ส่วน major bump ที่ต้องนั่งเทสจริง
  # (opencv 4->5, anthropic 0.x->1.x) ให้อัปมือตอนมีเวลาทดสอบ
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
    groups:
      python-packages:
        patterns: ["*"]
