<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบตรวจข้อสอบอูคูเลเล่</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <h1>ระบบตรวจข้อสอบอูคูเลเล่</h1>
    <p class="login-hint">หน้านี้มีชื่อและลายมือนักเรียนอยู่ ต้องกรอกรหัสผ่านก่อนเข้าใช้งาน</p>

    {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" autocomplete="off">
      <label class="login-label" for="accessCode">รหัสผ่าน</label>
      <!-- inputmode ไม่ล็อกเป็นตัวเลข เพราะครูอาจตั้งรหัสเป็นตัวอักษรก็ได้
           autofocus ช่วยบนมือถือ: แป้นพิมพ์เด้งขึ้นมาเลย ไม่ต้องจิ้มช่องก่อน -->
      <input type="password" id="accessCode" name="access_code" autofocus required>
      <button type="submit">เข้าใช้งาน</button>
    </form>

    <p class="login-note">ลืมรหัส? ดูที่ <code>access_code</code> ในไฟล์ settings.json บนเครื่องที่เปิดโปรแกรมอยู่</p>
  </main>
</body>
</html>
