name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ปักเวอร์ชันไว้ให้ตรงกับที่ใช้ตอนพัฒนา — ruff.toml ล็อกชุดกฎไว้แล้ว
      # การปักเวอร์ชันตรงนี้ทำให้ผลตรวจใน CI เหมือนกับที่รันในเครื่องเป๊ะ
      - name: ติดตั้ง ruff
        run: pip install ruff==0.16.5

      - name: ตรวจ lint
        run: ruff check . --output-format=github

  ui:
    name: เทสหน้าเว็บ (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # ci ไม่ใช่ install — ติดตั้งตาม package-lock.json เป๊ะ ๆ ผลใน CI จะได้
      # เหมือนที่รันในเครื่อง และไม่แอบยกเวอร์ชัน jsdom เองระหว่างทาง
      - name: ติดตั้ง jsdom
        run: npm ci

      # รันบน ubuntu อย่างเดียวพอ — เทสนี้ดูพฤติกรรม DOM ล้วน ไม่แตะไฟล์ระบบ
      # จึงไม่มีอะไรต่างระหว่าง OS ต่างจากเทสฝั่ง Python ที่ต้องรันบน Windows ด้วย
      - name: เทสฝั่งหน้าเว็บ (กันบันทึกซ้ำ + ล้างของคนเก่า)
        run: node tests/test_webapp_ui.mjs

  test:
    name: เทส (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest จำเป็นจริง ๆ ไม่ใช่ใส่เผื่อ — โปรเจกต์นี้เคยมีบั๊ก
        # 2 ตัวที่โผล่เฉพาะบน Windows: เขียนไฟล์ลง /tmp ไม่ได้ และ console
        # เข้ารหัส cp874 พิมพ์ภาษาไทยไม่ได้
        os: [ubuntu-latest, windows-latest]
        # 3.10 คือขั้นต่ำที่ README ประกาศไว้ ต้องเทสจริงว่ายังรันได้
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: ติดตั้ง dependency
        run: pip install -r requirements.txt

      - name: เทส logic การให้คะแนน
        run: python tests/test_core.py

      - name: เทสปรับแนวภาพเอียง
        run: python tests/test_align.py

      - name: เทส regions + pipeline
        run: python tests/test_regions_and_pipeline.py

      - name: เทสจับคู่กระดาษกับใบอ้างอิง
        run: python tests/test_register.py

      - name: เทสแตกหน้าจาก PDF ที่สแกนมา
        run: python tests/test_pdf_pages.py

      - name: เทส SDK ของ Claude/Google (mock)
        run: python tests/test_real_integrations_mocked.py

      - name: เทสสัญญากับ SDK ตัวจริง (opencv + anthropic)
        run: python tests/test_sdk_contract.py

      - name: เทสเว็บแอป + ตัวโหลด settings.json
        run: python tests/test_webapp.py

      - name: รัน demo ทั้ง pipeline
        run: python demo/run_demo.py
